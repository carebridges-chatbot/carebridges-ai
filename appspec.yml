version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/.ssh/carebridges-rag
    overwrite: yes

file_exists_behavior: OVERWRITE

permissions:
  - object: /home/ubuntu/.ssh/carebridges-rag
    owner: ubuntu
    group: ubuntu

hooks:
  ApplicationStop:
    - location: deploy/stop.sh
      timeout: 30
      runas: ubuntu

  AfterInstall:
    - location: deploy/deploy.sh
      timeout: 300
      runas: ubuntu

  ApplicationStart:
    - location: deploy/start.sh
      timeout: 60
      runas: ubuntu